name: Update Object Metadata
on:
  post-commit:
    branches:
      - ingestion*
hooks:
  - id: update_object_metadata_csv
    type: lua
    properties:
      script_path: scripts/update_object_metadata_csv.lua # location of this script in the repository!
      args:
        prefix: 'data/stanfordogsdataset/'
        annotation_folder_name: 'Annotation_CSV'
        object_folder_name: 'Images'
        object_file_name_extension: 'jpg'
