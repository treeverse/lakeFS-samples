# Locked dependency resolutions for reproducible installs.
#
# `make setup` installs this file, then `pip install -e .` (no deps) to wire up
# the local packages. Regenerate after changing pyproject.toml with:
#
#   pip install pip-tools
#   pip-compile --all-extras --output-file requirements.lock pyproject.toml
#
# Pins below are the top-level direct dependencies across all extras. Pin your
# own transitive resolutions by regenerating with pip-compile in your target
# environment; the versions here are known-good direct pins.

