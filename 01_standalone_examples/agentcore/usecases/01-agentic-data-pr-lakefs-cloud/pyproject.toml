[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-data-pr-lakefs-cloud"
version = "0.1.0"
description = "Agentic Data PRs with Amazon Bedrock AgentCore and lakeFS Cloud"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

# Runtime dependencies. Version ranges live here; pinned resolutions live in
# requirements.lock, which `make setup` installs for reproducibility.
dependencies = [
    "requests>=2.31,<3",
    "python-dotenv>=1.0,<2",
    "boto3>=1.34,<2",
    "botocore>=1.34,<2",
]

[project.optional-dependencies]
# Installed on the machine that hosts the agent / packages it for AgentCore
# Runtime. Not needed for local curation/validation unit tests.
agent = [
    "strands-agents>=1.0,<2",
    "bedrock-agentcore>=0.1,<1",
    "mcp>=1.2,<2",
]
# The local Streamlit demo UI.
ui = [
    "streamlit>=1.36,<2",
]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.5,<1",
]

[tool.setuptools]
# Multiple top-level packages, mirroring the spec's suggested layout.
packages = [
    "common",
    "curation",
    "seed",
    "gateway",
    "orchestrator",
    "policy",
    "agent",
    "scripts",
]

[tool.setuptools.package-data]
seed = ["expected-results.json"]
gateway = ["schemas/*.json"]
policy = ["*.cedar"]
agent = ["*.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "policy/tests"]
markers = [
    "live: opt-in tests that hit live lakeFS Cloud and/or AWS (deselected by default)",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
