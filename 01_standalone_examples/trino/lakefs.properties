connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://host.docker.internal:8084/iceberg/api
iceberg.rest-catalog.nested-namespace-enabled=true
iceberg.rest-catalog.prefix=lakefs
# Iceberg credentials vending: Trino asks the lakeFS catalog for table-scoped,
# temporary storage credentials and uses them for all data I/O, so no static
# S3 access/secret keys are configured here.
iceberg.rest-catalog.vended-credentials-enabled=true
fs.native-s3.enabled=true
s3.endpoint=http://host.docker.internal:9004
s3.region=us-east-1
s3.path-style-access=true

iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.server-uri=http://host.docker.internal:8084/iceberg/api/v1/oauth/tokens
iceberg.rest-catalog.oauth2.credential=AKIAIOSFOLKFSSAMPLES:wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
iceberg.unique-table-location=true
